name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run has nothing useful to say, but let a running deploy finish
# rather than leaving the live site half-written.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Plain static site — no generator. Assemble a clean publish directory so
      # the source material in prepare/ never ships to the live site.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R index.html assets CNAME .nojekyll _site/

      # A build can succeed and still publish something broken: a renamed image,
      # a missing stylesheet, and the page just loads wrong with nothing thrown.
      - name: Verify the output
        run: |
          set -e
          test -f _site/index.html
          test -f _site/CNAME
          test -d _site/assets/img
          missing=0
          for ref in $(grep -oE 'assets/[A-Za-z0-9/_.-]+' _site/index.html | sort -u); do
            if [ ! -f "_site/$ref" ]; then echo "Missing referenced file: $ref"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Referenced files are missing"; exit 1; }
          echo "Output OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishing only happens for a push to main. A pull request stops after the
  # verify step above, which is the point: a broken change fails the PR, not the
  # live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
